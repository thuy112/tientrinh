<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 6.5 - XSS</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background: #f5f5f5;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .box {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        textarea {
            width: 100%;
            height: 120px;
            box-sizing: border-box;
            padding: 10px;
        }

        .result {
            margin-top: 15px;
            padding: 15px;
            border: 1px solid #ddd;
        }

        .warning {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>
<div id="app">
    <div class="container">
        <h1>Bài 6.5 — XSS</h1>
        <div class="box">
            <h2>Nhập HTML</h2>
            <textarea
                v-model="noiDung"
                placeholder="Nhập HTML vào đây..."
            ></textarea>
        </div>

        <div class="box">
            <h2>1. Interpolation {{ }}</h2>
            <div class="result">
                {{ noiDung }}
            </div>
        </div>

        <div class="box">
          <h2>2. v-html</h2>
            <div
                class="result"
                v-html="noiDung"
            ></div>
        </div>

        <div class="box">
            <h2>So sánh</h2>
            <p>
                <strong>{{ noiDung }}</strong>
            </p>
            <p class="warning">
                Không sử dụng v-html trực tiếp với nội dung
                do người dùng cung cấp.
            </p>
        </div>
    </div>
</div>

<script>
new Vue({
    el: '#app',
    data() {
        return {
            noiDung: ''
        }
    }
})
</script>
</body>
</html>
